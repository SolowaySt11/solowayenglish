meta:
  environment: python
  toolchain:
    name: pip
    version: "3.11"
build:
  requirementsPath: requirements.txt
  useCache: true
  commands:
    - apt-get update && apt-get install -y ffmpeg
run:
  scriptName: solowayenglish.py
  persistenceMount: /data
  containerPort: "80"
  servicePort: "80"
