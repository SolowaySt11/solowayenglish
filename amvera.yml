meta:
  environment: python
  toolchain:
    name: pip
    version: "3.11"
build:
  requirementsPath: requirements.txt
  useCache: true
  postBuild:
    - apt-get update
    - apt-get install -y ffmpeg
    - ffmpeg -version
run:
  scriptName: solowayenglish.py
  command: null
  persistenceMount: /data
  containerPort: "80"
  servicePort: "80"
